<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHatch4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="innovaBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="chromeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgHatch4)" />
  <circle cx="300" cy="180" r="140" fill="#F59E0B" opacity="0.08" />

  <path d="M 40 280 L 560 280" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <path d="M 60 280 L 540 280" stroke="#F59E0B" stroke-width="2" stroke-dasharray="16 12" />

  <!-- Innova Crysta Profile -->
  <g transform="translate(40, 10)">
    <ellipse cx="260" cy="265" rx="225" ry="18" fill="#000000" opacity="0.7" />

    <!-- Bold, aggressive SUV/MPV silhouette -->
    <path d="M 55 225 
             C 50 195 70 165 125 150 
             L 175 110 
             C 200 95 330 92 440 98 
             L 500 135 
             C 520 160 525 195 520 235 
             L 515 252 
             C 505 258 485 258 465 258 
             L 430 258 
             C 420 215 370 215 360 258 
             L 195 258 
             C 185 215 135 215 125 258 
             L 55 258 
             C 45 250 45 238 55 225 Z" 
          fill="url(#innovaBody)" stroke="#475569" stroke-width="2" />

    <!-- Chrome grille and belt line -->
    <path d="M 52 210 L 110 205" stroke="url(#chromeAccent)" stroke-width="4" />
    <path d="M 120 165 L 505 155" stroke="url(#chromeAccent)" stroke-width="2" />
    <path d="M 200 90 L 450 90" stroke="url(#chromeAccent)" stroke-width="3" stroke-linecap="round" />

    <!-- Tinted Glass -->
    <path d="M 180 115 L 135 148 L 205 148 L 250 115 Z" fill="#38BDF8" opacity="0.75" />
    <path d="M 260 115 L 215 148 L 325 148 L 345 115 Z" fill="#38BDF8" opacity="0.75" />
    <path d="M 355 115 L 335 148 L 415 148 L 430 115 Z" fill="#38BDF8" opacity="0.75" />
    <path d="M 440 115 L 425 148 L 490 148 L 475 125 Z" fill="#38BDF8" opacity="0.75" />

    <!-- Projector Headlight -->
    <path d="M 55 195 C 60 180 85 175 105 180 L 95 205 Z" fill="#FFFFFF" />
    <circle cx="85" cy="192" r="5" fill="#38BDF8" />
    <!-- LED Taillight -->
    <path d="M 510 165 C 520 170 520 195 515 215 L 490 200 Z" fill="#DC2626" />

    <!-- Innova Alloy Wheels (Bigger diameter) -->
    <circle cx="160" cy="255" r="37" fill="#0F172A" stroke="#334155" stroke-width="7" />
    <circle cx="160" cy="255" r="24" fill="#64748B" stroke="#E2E8F0" stroke-width="4" />
    <circle cx="160" cy="255" r="9" fill="#F59E0B" />

    <circle cx="395" cy="255" r="37" fill="#0F172A" stroke="#334155" stroke-width="7" />
    <circle cx="395" cy="255" r="24" fill="#64748B" stroke="#E2E8F0" stroke-width="4" />
    <circle cx="395" cy="255" r="9" fill="#F59E0B" />
  </g>

  <text x="300" y="325" text-anchor="middle" font-family="'Cabinet Grotesk', sans-serif" font-weight="800" font-size="22" fill="#F8FAFC">
    TOYOTA INNOVA / CRYSTA
  </text>
  <text x="300" y="345" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#94A3B8">
    Premium MPV / SUV · 7 Reclining Seats · 4-5 Bags · Hill Stations &amp; Luxury Outstation
  </text>
</svg>
