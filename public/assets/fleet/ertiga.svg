<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHatch3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#172A45" />
    </linearGradient>
    <linearGradient id="ertigaBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="windowGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgHatch3)" />
  <circle cx="300" cy="180" r="140" fill="#60A5FA" opacity="0.08" />

  <path d="M 40 280 L 560 280" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <path d="M 60 280 L 540 280" stroke="#F59E0B" stroke-width="2" stroke-dasharray="16 12" />

  <!-- Ertiga MUV Profile -->
  <g transform="translate(45, 15)">
    <ellipse cx="255" cy="260" rx="215" ry="16" fill="#000000" opacity="0.6" />

    <!-- 7 Seater MUV Chassis (tall roof, 3 row glass) -->
    <path d="M 65 220 
             C 60 200 80 175 125 160 
             L 180 120 
             C 200 110 320 105 420 110 
             L 470 145 
             C 490 170 495 200 490 230 
             L 485 248 
             C 480 252 460 252 445 252 
             L 410 252 
             C 400 215 355 215 345 252 
             L 190 252 
             C 180 215 135 215 125 252 
             L 65 252 
             C 55 245 55 235 60 225 Z" 
          fill="url(#ertigaBody)" stroke="#94A3B8" stroke-width="2" />

    <!-- Roof rails -->
    <path d="M 210 102 L 430 102" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

    <!-- 3 Rows of Windows -->
    <path d="M 185 126 L 140 156 L 205 156 L 245 124 Z" fill="url(#windowGrad3)" opacity="0.9" />
    <path d="M 255 124 L 215 156 L 315 156 L 335 124 Z" fill="url(#windowGrad3)" opacity="0.9" />
    <path d="M 345 124 L 325 156 L 395 156 L 410 124 Z" fill="url(#windowGrad3)" opacity="0.9" />
    <path d="M 420 124 L 405 156 L 460 156 L 450 135 Z" fill="url(#windowGrad3)" opacity="0.9" />

    <!-- Lights -->
    <path d="M 65 195 C 65 185 85 180 100 185 L 90 210 Z" fill="#FEF08A" opacity="0.95" />
    <path d="M 480 170 C 490 175 490 195 485 210 L 465 195 Z" fill="#EF4444" />

    <!-- Wheels -->
    <circle cx="155" cy="250" r="34" fill="#0F172A" stroke="#334155" stroke-width="6" />
    <circle cx="155" cy="250" r="22" fill="#94A3B8" stroke="#E2E8F0" stroke-width="3" />
    <circle cx="155" cy="250" r="8" fill="#F59E0B" />

    <circle cx="375" cy="250" r="34" fill="#0F172A" stroke="#334155" stroke-width="6" />
    <circle cx="375" cy="250" r="22" fill="#94A3B8" stroke="#E2E8F0" stroke-width="3" />
    <circle cx="375" cy="250" r="8" fill="#F59E0B" />
  </g>

  <text x="300" y="325" text-anchor="middle" font-family="'Cabinet Grotesk', sans-serif" font-weight="800" font-size="22" fill="#F8FAFC">
    MARUTI SUZUKI ERTIGA
  </text>
  <text x="300" y="345" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#94A3B8">
    Spacious 7-Seater MUV · 6-7 Passengers · 3-4 Bags · Family Getaways &amp; Long Drives
  </text>
</svg>
